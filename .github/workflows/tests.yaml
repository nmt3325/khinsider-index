name: Offline crawler regression tests
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts
            wayback
            .github
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: scripts/requirements-meta.txt
      - run: python -m pip install -r scripts/requirements-meta.txt pytest ruff pyyaml
      - name: Compile and check fatal lint errors
        run: |
          python -m compileall -q scripts wayback test_shared_player.py
          ruff check --select E9,F63,F7,F82 scripts wayback test_shared_player.py
      - name: Offline tests
        env:
          PYTHONPATH: scripts:wayback
        run: python -m pytest -q scripts wayback test_shared_player.py
      - name: Validate workflows
        if: matrix.python-version == '3.12'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/actionlint"
          cd "$RUNNER_TEMP/actionlint"
          gh release download v1.7.12 --repo rhysd/actionlint --pattern actionlint_1.7.12_linux_amd64.tar.gz --pattern actionlint_1.7.12_checksums.txt
          grep '  actionlint_1.7.12_linux_amd64.tar.gz$' actionlint_1.7.12_checksums.txt | sha256sum --check
          tar -xzf actionlint_1.7.12_linux_amd64.tar.gz actionlint
          cd "$GITHUB_WORKSPACE"
          "$RUNNER_TEMP/actionlint/actionlint" -shellcheck=''
