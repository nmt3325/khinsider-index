name: Incremental updates and pending backfill

on:
  schedule:
    - cron: '40 */4 * * *'
  workflow_dispatch:
    inputs:
      minutes:
        description: 'Collection budget in minutes (1–240)'
        type: number
        default: 240
      publish:
        description: 'Publish all accumulated valid records while failed requests remain queued'
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  backfill:
    uses: ./.github/workflows/live-data.yaml
    with:
      mode: backfill
      minutes: ${{ fromJSON(github.event_name == 'workflow_dispatch' && format('{0}', inputs.minutes) || '240') }}
      publish: ${{ github.event_name != 'workflow_dispatch' || inputs.publish }}
