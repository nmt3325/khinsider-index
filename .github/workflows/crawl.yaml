name: "Generate extra info from index"
on:
  # schedule:
  #   - cron: "0 */7 * * *"
  # push:
  #   branches:
  #     - 'main'
  #   paths:
  #     - 'index.json'
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHONUNBUFFERED: 1 # ensure that python scripts live output instead of buffering

jobs:
  index-crawl:
    name: index-crawl
    runs-on: ubuntu-latest
    steps:

      - name: Checkout
        uses: actions/checkout@v4

      # Pin the interpreter. requirements.txt still carries 2023-era pins, and
      # letting the runner pick its newest Python is what silently broke this
      # job: pendulum 2.x builds itself with distutils, which 3.12 removed.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: 'pip'
          cache-dependency-path: scripts/requirements.txt

      - run: pip install -r requirements.txt
        working-directory: scripts

      - name: Check what this fork is allowed to do
        id: caps
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          # The sync steps below rsync into khindex.utf9k.net, which only the
          # upstream repository holds a key for. Without the secret they fail
          # every single run, so skip them instead of painting the job red.
          if [ -n "$DEPLOY_SSH_KEY" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "DEPLOY_SSH_KEY is not set, so the API sync steps were skipped." \
              >> "$GITHUB_STEP_SUMMARY"
          fi

      - run: python platforms.py
        working-directory: scripts

      - run: python index_to_letters.py
        working-directory: scripts

      - run: python gen-alt-index.py
        working-directory: scripts

      # scrape.py asks for album pages with plain requests, which Cloudflare
      # now blocks. scripts/crawl_album_meta.py is the supported path, so this
      # is kept for reference but no longer allowed to fail the run.
      - run: python scrape.py
        working-directory: scripts
        continue-on-error: true

      - run: python remove_dead_links.py
        working-directory: scripts
        continue-on-error: true

      - name: Commit and push changes
        if: always()
        run: |
          set -eux

          git config --local user.email "helper@utf9k.net"
          git config --local user.name "Indexer Bot"
          git config pull.rebase false

          git pull
          git add .
          git commit -a -m "Index extras have been updated" || exit 0
          # the checked-out credentials plus contents:write are enough here;
          # the old third-party push action only ever returned 403
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Sync index to API
        if: always() && steps.caps.outputs.deploy == 'true'
        uses: up9cloud/action-rsync@master
        env:
          USER: gharunner
          HOST: khindex.utf9k.net
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SOURCE: index-alt.json
          TARGET: /var/www/html/khindex/index.json
          ARGS: -azv

      - name: Sync alphabetical groupings to API
        if: always() && steps.caps.outputs.deploy == 'true'
        uses: up9cloud/action-rsync@master
        env:
          USER: gharunner
          HOST: khindex.utf9k.net
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SOURCE: letters/
          TARGET: /var/www/html/khindex/letters
          ARGS: -azv

      - name: Sync albums to API
        if: always() && steps.caps.outputs.deploy == 'true'
        uses: up9cloud/action-rsync@master
        env:
          USER: gharunner
          HOST: khindex.utf9k.net
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SOURCE: albums/
          TARGET: /var/www/html/khindex/albums
          ARGS: -azv

      - name: Sync platform list to API
        if: always() && steps.caps.outputs.deploy == 'true'
        uses: up9cloud/action-rsync@master
        env:
          USER: gharunner
          HOST: khindex.utf9k.net
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SOURCE: platforms.json
          TARGET: /var/www/html/khindex/platforms.json
          ARGS: -azv
