name: "Check whether to make new release"
on:
  push:
    branches:
      - 'main'
    paths:
      - 'index.json'
    # Pushing tag will retrigger so we don't want
    # to end up in an infinite loop!
    tags-ignore:
      - '**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: release
    runs-on: ubuntu-latest
    steps:

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # See https://github.community/t/push-from-action-even-with-pat-does-not-trigger-action/17622/6
          persist-credentials: false


      - name: Generate diff
        run: |
          # a release body is capped at 125,000 characters and index.json is
          # 15 MB, so the raw diff has to be truncated or the release 422s
          git diff $(git describe --tags --abbrev=0)..HEAD -- index.json \
            | head -c 100000 > diff.txt
          {
            echo "\`\`\`diff"
            cat diff.txt
            echo "\`\`\`"
          } > changes.md

      - name: Compress index
        run: tar -czvf index.tar.gz index.json

      - name: Get current date
        id: date
        # ::set-output was removed from Actions, which left the release name
        # blank
        run: echo "date=$(date +'%Y-%m-%dT%H:%M:%S%z')" >> "$GITHUB_OUTPUT"

      - name: Bump version and push tag
        id: tag_version
        uses: mathieudutour/github-tag-action@v6.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          name: Index update for ${{ steps.date.outputs.date }}
          body_path: changes.md 
          token: ${{ secrets.GITHUB_TOKEN }}
          files: index.tar.gz
          tag_name: ${{ steps.tag_version.outputs.new_tag }}
