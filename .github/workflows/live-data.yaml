name: Standalone live-data engine

on:
  workflow_call:
    inputs:
      mode:
        type: string
        default: backfill
      minutes:
        type: number
        default: 240
      publish:
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    concurrency:
      group: khinsider-metadata
      cancel-in-progress: false
    env:
      PYTHONUNBUFFERED: '1'
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PYTHONPATH: scripts
      STATE_DIR: work/live-v2
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            /scripts/
            /.github/
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install crawler dependencies
        run: python -m pip install --disable-pip-version-check -r scripts/requirements-meta.txt
      - name: Restore only this generation's verified checkpoint
        id: restore
        run: python scripts/live_pipeline.py restore --state-dir "$STATE_DIR" --repo "$GITHUB_REPOSITORY"
      - name: Collect and publish only a complete live-only dataset
        env:
          MODE: ${{ inputs.mode }}
          MINUTES: ${{ inputs.minutes }}
          PUBLISH: ${{ inputs.publish }}
        run: |
          set -euo pipefail
          args=(run --state-dir "$STATE_DIR" --repo "$GITHUB_REPOSITORY"
                --mode "$MODE" --minutes "$MINUTES" --checkpoint)
          if [ "$PUBLISH" = 'true' ]; then args+=(--publish); fi
          python scripts/live_pipeline.py "${args[@]}"
      - name: Persist recoverable progress, never after a failed restore
        if: ${{ always() && steps.restore.outcome == 'success' }}
        run: python scripts/live_pipeline.py save --state-dir "$STATE_DIR" --repo "$GITHUB_REPOSITORY"
      - name: Show collection versus publication status
        if: ${{ always() && steps.restore.outcome == 'success' }}
        run: python scripts/live_pipeline.py status --state-dir "$STATE_DIR" --repo "$GITHUB_REPOSITORY"
      - name: Keep a secondary recovery copy
        if: ${{ always() && steps.restore.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: live-v2-checkpoint-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            work/checkpoint.tar.gz
            work/live-v2/progress.json
          retention-days: 7
          if-no-files-found: warn
