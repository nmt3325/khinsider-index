name: "Wayback archival (SPN2)"

on:
  schedule:
    - cron: "42 */6 * * *"
  workflow_dispatch:
    inputs:
      direct_minutes:
        description: "Minutes to generate direct audio-file URLs (0 = skip)"
        default: "60"
        required: false
      submit_minutes:
        description: "Minutes to submit URLs to the Wayback Machine"
        default: "260"
        required: false

permissions:
  contents: write

concurrency:
  group: wayback-archive
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: 1
  METADATA_FILE: work/live-v2/album-meta.ndjson
  CATALOGUE_FILE: work/live-v2/catalogue.json
  PYTHONPATH: scripts

jobs:
  archive:
    name: wayback-archive
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - name: Checkout archival tools and standalone crawler
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            wayback
            scripts
          sparse-checkout-cone-mode: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --disable-pip-version-check -r scripts/requirements-meta.txt requests

      - name: Restore state from releases
        id: restore
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p work /tmp/khrel
          gh release download song-urls-2026-09-01 \
            --pattern 'crawl_state_snapshot.tar.gz' \
            --pattern 'wayback_queue_khinsider-track-urls.txt.gz' \
            --dir /tmp/khrel --clobber
          tar xzf /tmp/khrel/crawl_state_snapshot.tar.gz
          gunzip -c /tmp/khrel/wayback_queue_khinsider-track-urls.txt.gz > work/wayback_queue.txt
          touch work/wayback_done.txt work/wayback_failed.txt work/crawl_failures.log \
                work/direct_done.txt work/direct_failures.log work/direct_queue.txt work/direct_links.jsonl
          wc -l work/*.txt | tail -10 || true

      - name: Restore modern metadata separately from archival history
        id: modern
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python scripts/live_pipeline.py restore --repo "$GITHUB_REPOSITORY"
          python - <<'PY'
          import os
          import live_data
          from pathlib import Path
          catalogue = Path(os.environ['CATALOGUE_FILE'])
          ready = False
          if catalogue.exists():
              ready = live_data.inspect(catalogue, os.environ['METADATA_FILE'])[-1]['complete']
          with open(os.environ['GITHUB_OUTPUT'], 'a') as stream:
              stream.write('ready=' + str(ready).lower() + '\n')
          print('Modern metadata complete:', ready)
          PY

      - name: Generate direct audio-file URLs (time-boxed)
        if: ${{ steps.modern.outputs.ready == 'true' }}
        env:
          DIRECT_MINUTES: ${{ github.event.inputs.direct_minutes || '60' }}
        run: |
          [[ "$DIRECT_MINUTES" =~ ^[0-9]{1,3}$ ]] || exit 1
          DIRECT_MINUTES=$((10#$DIRECT_MINUTES))
          (( DIRECT_MINUTES <= 60 )) || exit 1
          if (( DIRECT_MINUTES == 0 )); then exit 0; fi
          export DIRECT_MAX_SECONDS=$(( DIRECT_MINUTES * 60 ))
          echo "direct budget: ${DIRECT_MAX_SECONDS}s"
          python wayback/direct_links.py

      - name: Submit URLs to Wayback Machine (time-boxed)
        env:
          ARCHIVE_ORG_S3_ACCESS: ${{ secrets.ARCHIVE_ORG_S3_ACCESS }}
          ARCHIVE_ORG_S3_SECRET: ${{ secrets.ARCHIVE_ORG_S3_SECRET }}
          SUBMIT_MINUTES: ${{ github.event.inputs.submit_minutes || '260' }}
          QUEUE_GLOB: work/queue_submit.txt
        run: |
          [[ "$SUBMIT_MINUTES" =~ ^[0-9]{1,3}$ ]] || exit 1
          SUBMIT_MINUTES=$((10#$SUBMIT_MINUTES))
          (( SUBMIT_MINUTES <= 260 )) || exit 1
          if (( SUBMIT_MINUTES == 0 )); then exit 0; fi
          touch work/wayback_queue_crawled.txt
          cat work/wayback_queue_crawled.txt work/direct_queue.txt work/wayback_queue.txt > work/queue_submit.txt
          wc -l work/queue_submit.txt
          export SPN2_MAX_SECONDS=$(( ${SUBMIT_MINUTES%.*} * 60 ))
          echo "submit budget: ${SPN2_MAX_SECONDS}s"
          python wayback/spn2_submit.py

      - name: Persist state to release
        if: ${{ always() && steps.restore.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          files=()
          for f in work/missing_slugs.txt work/crawl_done.txt work/crawl_failures.log \
                   work/wayback_done.txt work/wayback_failed.txt \
                   work/songs_crawled.jsonl work/wayback_queue_crawled.txt \
                   work/direct_done.txt work/direct_failures.log \
                   work/direct_links.jsonl work/direct_queue.txt; do
            if [ -f "$f" ]; then
              files+=("$f")
            fi
          done
          if [ "${#files[@]}" -eq 0 ]; then
            echo "no restored state files were available to persist" >&2
            exit 1
          fi
          tar czf /tmp/khrel/crawl_state_snapshot.tar.gz "${files[@]}"
          test -s /tmp/khrel/crawl_state_snapshot.tar.gz
          gh release upload song-urls-2026-09-01 /tmp/khrel/crawl_state_snapshot.tar.gz --clobber
