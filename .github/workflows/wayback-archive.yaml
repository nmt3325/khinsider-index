name: "Wayback archival (SPN2)"

on:
  schedule:
    - cron: "42 */6 * * *"
  workflow_dispatch:
    inputs:
      crawl_minutes:
        description: "Minutes to crawl album pages for song URLs (0 = skip)"
        default: "30"
        required: false
      submit_minutes:
        description: "Minutes to submit song URLs to the Wayback Machine"
        default: "270"
        required: false

permissions:
  contents: write

concurrency:
  group: wayback-archive
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: 1

jobs:
  archive:
    name: wayback-archive
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - name: Checkout (wayback scripts only)
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            wayback
          sparse-checkout-cone-mode: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install curl_cffi requests

      - name: Restore state from release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eux
          mkdir -p work /tmp/khrel
          gh release download song-urls-2026-09-01 \
            --pattern 'crawl_state_snapshot.tar.gz' \
            --pattern 'wayback_queue_khinsider-track-urls.txt.gz' \
            --dir /tmp/khrel --clobber
          tar xzf /tmp/khrel/crawl_state_snapshot.tar.gz
          gunzip -c /tmp/khrel/wayback_queue_khinsider-track-urls.txt.gz > work/wayback_queue.txt
          touch work/wayback_done.txt work/wayback_failed.txt work/crawl_failures.log
          wc -l work/wayback_queue.txt work/wayback_queue_crawled.txt work/wayback_done.txt work/crawl_done.txt || true

      - name: Crawl album pages for song URLs (time-boxed)
        env:
          CRAWL_MINUTES: ${{ github.event.inputs.crawl_minutes || '30' }}
        run: |
          export CRAWL_MAX_SECONDS=$(( ${CRAWL_MINUTES%.*} * 60 ))
          echo "crawl budget: ${CRAWL_MAX_SECONDS}s"
          python wayback/crawl_songs.py

      - name: Submit song URLs to Wayback Machine (time-boxed)
        env:
          ARCHIVE_ORG_S3_ACCESS: ${{ secrets.ARCHIVE_ORG_S3_ACCESS }}
          ARCHIVE_ORG_S3_SECRET: ${{ secrets.ARCHIVE_ORG_S3_SECRET }}
          SUBMIT_MINUTES: ${{ github.event.inputs.submit_minutes || '270' }}
        run: |
          export SPN2_MAX_SECONDS=$(( ${SUBMIT_MINUTES%.*} * 60 ))
          echo "submit budget: ${SPN2_MAX_SECONDS}s"
          python wayback/spn2_submit.py

      - name: Persist state to release
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -ux
          tar czf /tmp/khrel/crawl_state_snapshot.tar.gz \
            work/missing_slugs.txt work/crawl_done.txt work/crawl_failures.log \
            work/wayback_done.txt work/wayback_failed.txt \
            work/songs_crawled.jsonl work/wayback_queue_crawled.txt
          gh release upload song-urls-2026-09-01 /tmp/khrel/crawl_state_snapshot.tar.gz --clobber
