name: Album metadata sweep

on:
  schedule:
    - cron: '20 3 * * *'
  workflow_dispatch:
    inputs:
      minutes:
        description: 'Collection budget in minutes (1–240)'
        type: number
        default: 180
      publish:
        description: 'Publish only when all current albums have complete tracks'
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  sweep:
    uses: ./.github/workflows/live-data.yaml
    with:
      mode: refresh
      minutes: ${{ fromJSON(github.event_name == 'workflow_dispatch' && format('{0}', inputs.minutes) || '180') }}
      publish: ${{ github.event_name != 'workflow_dispatch' || inputs.publish }}
