name: Daily incremental album updates

on:
  schedule:
    - cron: '20 3 * * *'
  workflow_dispatch:
    inputs:
      minutes:
        description: 'Collection budget in minutes (1–240)'
        type: number
        default: 20
      publish:
        description: 'Publish the full accumulated index, never only the daily delta'
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  sweep:
    uses: ./.github/workflows/live-data.yaml
    with:
      mode: incremental
      minutes: ${{ fromJSON(github.event_name == 'workflow_dispatch' && format('{0}', inputs.minutes) || '20') }}
      publish: ${{ github.event_name != 'workflow_dispatch' || inputs.publish }}
