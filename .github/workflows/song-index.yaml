name: song-index

# Builds the song title index (songs.tsv.gz) that the Subsonic relay uses for
# song-name search, from the crawled track URLs stored on the song-urls
# release.  Published to its own PRE-release tag on purpose: "latest" must keep
# pointing at the library.json release that the relay downloads by default.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish the song index to
        default: song-index
      source_tag:
        description: Release holding the crawl assets
        default: song-urls-2026-09-01
  schedule:
    # Mondays, a few hours after the wayback crawl has had a full weekend
    - cron: '17 5 * * 1'

concurrency:
  group: song-index
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ inputs.tag || 'song-index' }}
      SOURCE_TAG: ${{ inputs.source_tag || 'song-urls-2026-09-01' }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts
          sparse-checkout-cone-mode: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download crawl assets
        run: |
          mkdir -p work
          gh release download "$SOURCE_TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern crawl_state_snapshot.tar.gz \
            --pattern songs_cached.jsonl.gz \
            --dir work --clobber
          ls -la work

      - name: Download library.json for coverage stats
        run: |
          if gh release download --repo "$GITHUB_REPOSITORY" --pattern library.json --dir work --clobber; then
            echo "library.json downloaded"
          else
            echo "no library.json on the latest release, skipping coverage stats"
          fi

      - name: Build song index
        run: |
          python scripts/build_song_index.py \
            --snapshot work/crawl_state_snapshot.tar.gz \
            --cached work/songs_cached.jsonl.gz \
            --library work/library.json \
            --out work/songs.tsv.gz \
            --manifest work/songs-index.json
          ls -la work/songs.tsv.gz work/songs-index.json
          cat work/songs-index.json

      - name: Publish
        run: |
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --prerelease \
              --title 'Song title index' \
              --notes 'Track titles for song-name search in the Subsonic relay (album, disc, track, title as gzipped TSV). Rebuilt weekly by .github/workflows/song-index.yaml. Kept as a pre-release so that releases/latest keeps resolving to the library.json release.'
          fi
          gh release upload "$TAG" work/songs.tsv.gz work/songs-index.json \
            --repo "$GITHUB_REPOSITORY" --clobber
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY"
