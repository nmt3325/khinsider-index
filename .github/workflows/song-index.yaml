name: song-index

on:
  schedule:
    - cron: '17 5 * * 1'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Rebuild and publish the complete live-only serving pair'
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  rebuild:
    uses: ./.github/workflows/live-data.yaml
    with:
      mode: build
      minutes: 1
      publish: ${{ github.event_name != 'workflow_dispatch' || inputs.publish }}
